<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#404040" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Biomechanics force platform sensor plate -->
  <rect x="3" y="14" width="18" height="4" rx="1"/>
