  <polyline points="8 7 12 3 16 7"/>
  <!-- Foundation support feet and lab floor baseline -->
  <line x1="6" y1="18" x2="6" y2="21"/>
  <line x1="18" y1="18" x2="18" y2="21"/>
  <line x1="2" y1="21" x2="22" y2="21"/>
</svg>
